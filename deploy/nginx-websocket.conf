# Trecho para o vhost do site no CloudPanel (Nginx) habilitar WebSocket.
#
# No CloudPanel: Sites → seu site → "Vhost" (editor de configuração).
# O CloudPanel já cria um location "/" com proxy_pass para a app Node.
# Garanta que esse location tenha as linhas de Upgrade/Connection abaixo.
# (Se já existir um proxy_pass gerado pelo painel, apenas ADICIONE as linhas
#  de Upgrade/Connection/http_version dentro dele.)

location / {
    proxy_pass http://127.0.0.1:3000;   # a porta PORT do .env

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;          # <-- essencial p/ WebSocket
    proxy_set_header Connection $connection_upgrade; # <-- essencial p/ WebSocket

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_read_timeout 3600s;   # mantém o WebSocket aberto (áudio longo)
    proxy_send_timeout 3600s;
}

# O CloudPanel normalmente já define este map no http{} dele. Se der erro de
# "$connection_upgrade não definido", adicione este bloco no nginx.conf global:
#
# map $http_upgrade $connection_upgrade {
#     default upgrade;
#     ''      close;
# }
