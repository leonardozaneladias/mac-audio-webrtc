# coturn (servidor TURN) para o Mac Audio.
# Relê o áudio quando a conexão direta P2P não passa pelo NAT (celular no 4G/5G).
#
# Troque:
#   - turn.seudominio.com  → seu (sub)domínio do TURN
#   - SEU_SEGREDO_TURN     → o MESMO valor de TURN_SECRET no .env
#   - SEU_IP_PUBLICO       → IP público da sua casa (ou remova external-ip se DDNS)

# --- Portas ---
listening-port=3478
tls-listening-port=5349

# --- Faixa de portas de relay (abra no roteador tb!) ---
min-port=49160
max-port=49200

# --- Realm / domínio ---
realm=turn.seudominio.com
server-name=turn.seudominio.com

# --- Autenticação por segredo compartilhado (TURN REST / credenciais temporárias) ---
use-auth-secret
static-auth-secret=SEU_SEGREDO_TURN

# --- IP público (necessário atrás de NAT). Se tiver IP fixo, informe aqui.
# Com DDNS/Cloudflare, você pode comentar esta linha e deixar o coturn detectar.
external-ip=SEU_IP_PUBLICO

# --- TLS (turns://). Aponte para os certificados do seu domínio.
# Se usar Let's Encrypt no homelab, ajuste os caminhos abaixo.
cert=/etc/letsencrypt/live/turn.seudominio.com/fullchain.pem
pkey=/etc/letsencrypt/live/turn.seudominio.com/privkey.pem

# --- Segurança / robustez ---
no-cli
no-multicast-peers
no-tlsv1
no-tlsv1_1
# Bloqueia relay para redes privadas (evita abuso do seu TURN como pivô interno)
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
# Limite de banda por sessão (bytes/s), opcional
# max-bps=128000

# Log
log-file=/var/log/turnserver.log
simple-log
