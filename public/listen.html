<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="theme-color" content="#0a84ff" />
  <title>Escutar · Mac Audio</title>
  <link rel="icon" href="/icons/icon-192.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icons/icon-180.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Escutar" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="gate"></div>

  <main id="app" class="wrap hidden">
    <div class="app-head">
      <div class="logo">🎧</div>
      <div>
        <h1>Escutar</h1>
        <div class="sub">áudio do Mac ao vivo</div>
      </div>
    </div>

    <div class="card">
      <button class="btn big green" id="start">▶︎ Escutar</button>
      <button class="btn big red hidden" id="stop">⏹ Parar de escutar</button>
      <div class="status" style="margin-top:14px">
        <span class="dot" id="dot"></span>
        <span id="state">Parado</span>
        <span class="timer muted" id="timer" style="margin-left:auto"></span>
      </div>
      <div class="vu"><i id="vu"></i></div>
    </div>

    <div class="card hidden" id="volCard">
      <h2>Volume</h2>
      <div class="field">
        <label>Nível <span class="val"><span id="pct">100</span>%</span></label>
        <input type="range" id="vol" min="0" max="150" value="100" />
      </div>
      <div class="btn-row" style="margin-top:12px">
        <button class="btn turbo" id="turbo">🚀 Turbo</button>
        <button class="btn ghost" id="mute">🔇 Mudo</button>
      </div>
      <div class="warn-txt hidden" id="turboWarn">Turbo: volume amplificado com compressor — pode distorcer em som muito alto.</div>
    </div>

    <div class="card hidden" id="connCard">
      <h2>Conexão</h2>
      <div style="text-align:center"><span class="badge" id="qbadge">—</span></div>
      <div class="metrics">
        <div class="metric"><div class="v" id="mRtt">—</div><div class="l">latência</div></div>
        <div class="metric"><div class="v" id="mLoss">—</div><div class="l">perda</div></div>
        <div class="metric"><div class="v" id="mJit">—</div><div class="l">jitter</div></div>
      </div>
    </div>

    <div class="card hidden" id="recCard">
      <h2>Gravar o que estou ouvindo</h2>
      <button class="btn ghost" id="record">⏺️ Gravar</button>
      <div id="recList"></div>
    </div>

    <div class="hint">Dica: no iPhone, toque em Compartilhar → “Adicionar à Tela de Início” para virar app.</div>
  </main>

  <!-- keepalive mudo mantém o fluxo WebRTC vivo no iOS -->
  <audio id="keepalive" autoplay playsinline muted></audio>

  <script src="/common.js"></script>
  <script src="/listen.js"></script>
</body>
</html>
